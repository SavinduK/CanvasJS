<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Stylus Web Canvas</title>

  <!-- External Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex flex-col select-none">

  <!-- TOP HEADER / NAVBAR -->
  <header class="h-14 shrink-0 px-4 flex items-center justify-between border-b border-white/10 bg-[#18181b] z-20">
    <!-- Left: Title & Page Navigation -->
    <div class="flex items-center gap-3">
      <button class="p-2 rounded-lg hover:bg-white/5 text-gray-300">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <input type="text" id="noteTitleInput" value="Untitled Note" class="bg-transparent text-sm sm:text-base font-semibold focus:outline-none border-b border-transparent focus:border-blue-500 px-1 py-0.5 text-white w-32 sm:w-48">
      
      <div class="h-4 w-px bg-white/10 mx-1"></div>

      <!-- Page Controls -->
      <div class="flex items-center gap-1 bg-white/5 rounded-lg p-1 border border-white/10">
        <button id="prevPage" class="p-1 rounded hover:bg-white/10 disabled:opacity-30 disabled:hover:bg-transparent text-gray-300">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
        <span id="pageIndicator" class="text-xs font-mono font-medium px-2 text-gray-300">1 / 1</span>
        <button id="nextPage" class="p-1 rounded hover:bg-white/10 disabled:opacity-30 disabled:hover:bg-transparent text-gray-300">
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
        <button id="newPage" class="p-1 rounded hover:bg-white/10 text-blue-400 ml-1" title="Add Page After Selected">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
        <button id="deletePageBtn" class="p-1 rounded hover:bg-red-500/10 disabled:opacity-30 disabled:hover:bg-transparent text-red-400" title="Delete Current Page">
          <i data-lucide="trash-2" class="w-4 h-4 text-red-400"></i>
        </button>
      </div>
    </div>

    <!-- Right: Header Controls & Separate Category Dropdown Menus -->
    <div class="flex items-center gap-1 sm:gap-2">
      <input type="file" id="imageFileInput" accept="image/*" class="hidden">
      <input type="file" id="pdfFileInput" accept="application/pdf" class="hidden">

      <!-- 1. Actions Dropdown -->
      <div class="relative header-dropdown">
        <button id="actionsMenuBtn" class="p-2 rounded-lg hover:bg-white/5 text-gray-300 transition" title="Actions">
          <i data-lucide="plus-circle" class="w-5 h-5"></i>
        </button>
        <div id="actionsMenu" class="hidden absolute right-0 mt-2 w-56 bg-[#242427] border border-white/10 rounded-xl shadow-2xl py-2 z-50 text-sm">
          <div class="px-3 py-1.5 text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Actions</div>
          <button id="importPdfBtn" class="w-full px-3 py-2 text-left hover:bg-white/5 flex items-center gap-2 text-gray-200 transition">
            <i data-lucide="file-up" class="w-4 h-4 text-rose-400"></i> Import PDF Document
          </button>
          <button id="importImgBtn" class="w-full px-3 py-2 text-left hover:bg-white/5 flex items-center gap-2 text-gray-200 transition">
            <i data-lucide="image-plus" class="w-4 h-4 text-blue-400"></i> Add Image
          </button>
          <button id="clearBtn" class="w-full px-3 py-2 text-left hover:bg-white/5 text-amber-400 flex items-center gap-2 transition">
            <i data-lucide="eraser" class="w-4 h-4 text-amber-400"></i> Clear Page Drawing
          </button>
          <button id="deletePageMenuBtn" class="w-full px-3 py-2 text-left hover:bg-red-500/10 text-red-400 flex items-center gap-2 transition">
            <i data-lucide="trash-2" class="w-4 h-4 text-red-400"></i> Delete Current Page
          </button>
        </div>
      </div>

      <!-- 2. Page Templates Dropdown -->
      <div class="relative header-dropdown">
        <button id="templateMenuBtn" class="p-2 rounded-lg hover:bg-white/5 text-gray-300 transition" title="Page Templates">
          <i data-lucide="layout-template" class="w-5 h-5"></i>
        </button>
        <div id="templateMenu" class="hidden absolute right-0 mt-2 w-56 bg-[#242427] border border-white/10 rounded-xl shadow-2xl py-2 z-50 text-sm">
          <div class="px-3 py-1.5 text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Page Template</div>
          <button class="template-option w-full px-3 py-2 text-left hover:bg-white/5 flex items-center gap-2 text-gray-200" data-template="ruled">
            <i data-lucide="align-justify" class="w-4 h-4 text-blue-400"></i> Ruled Lines
          </button>
          <button class="template-option w-full px-3 py-2 text-left hover:bg-white/5 flex items-center gap-2 text-gray-200" data-template="grid">
            <i data-lucide="grid-3x3" class="w-4 h-4 text-emerald-400"></i> Square Grid
          </button>
          <button class="template-option w-full px-3 py-2 text-left hover:bg-white/5 flex items-center gap-2 text-gray-200" data-template="flashcard">
            <i data-lucide="columns-2" class="w-4 h-4 text-purple-400"></i> Flashcards (2 Cards)
          </button>
          <button class="template-option w-full px-3 py-2 text-left hover:bg-white/5 flex items-center gap-2 text-gray-200" data-template="blank">
            <i data-lucide="square" class="w-4 h-4 text-gray-400"></i> Blank Page
          </button>
        </div>
      </div>

      <!-- 3. Settings Dropdown -->
      <div class="relative header-dropdown">
        <button id="settingsMenuBtn" class="p-2 rounded-lg hover:bg-white/5 text-gray-300 transition" title="Settings">
          <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
        </button>
        <div id="settingsMenu" class="hidden absolute right-0 mt-2 w-64 bg-[#242427] border border-white/10 rounded-xl shadow-2xl py-2 z-50 text-sm">
          <div class="px-3 py-1.5 text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Settings</div>
          <label class="px-3 py-2 hover:bg-white/5 flex items-center justify-between cursor-pointer text-gray-200">
            <span class="flex items-center gap-2"><i data-lucide="maximize-2" class="w-4 h-4 text-cyan-400"></i> Fit to Screen Mode</span>
            <input type="checkbox" id="fitToScreenToggle" checked class="rounded border-gray-600 text-blue-500 focus:ring-0">
          </label>
          <label class="px-3 py-2 hover:bg-white/5 flex items-center justify-between cursor-pointer text-gray-200">
            <span class="flex items-center gap-2"><i data-lucide="hand" class="w-4 h-4 text-emerald-400"></i> Draw with Hand (Touch)</span>
            <input type="checkbox" id="touchDrawingToggle" checked class="rounded border-gray-600 text-blue-500 focus:ring-0">
          </label>
          <label class="px-3 py-2 hover:bg-white/5 flex items-center justify-between cursor-pointer text-gray-200">
            <span class="flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i> Pressure Sensitivity</span>
            <input type="checkbox" id="pressureToggle" checked class="rounded border-gray-600 text-blue-500 focus:ring-0">
          </label>
        </div>
      </div>

      <!-- 4. Export Dropdown -->
      <div class="relative header-dropdown">
        <button id="exportMenuBtn" class="p-2 rounded-lg hover:bg-white/5 text-gray-300 transition" title="Export">
          <i data-lucide="download" class="w-5 h-5"></i>
        </button>
        <div id="exportMenu" class="hidden absolute right-0 mt-2 w-56 bg-[#242427] border border-white/10 rounded-xl shadow-2xl py-2 z-50 text-sm">
          <div class="px-3 py-1.5 text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Export</div>
          <button id="exportImgBtn" class="w-full px-3 py-2 text-left hover:bg-white/5 flex items-center gap-2 text-gray-200">
            <i data-lucide="image" class="w-4 h-4 text-indigo-400"></i> Export PNG
          </button>
          <button id="exportPdfBtn" class="w-full px-3 py-2 text-left hover:bg-white/5 flex items-center gap-2 text-gray-200">
            <i data-lucide="file-text" class="w-4 h-4 text-rose-400"></i> Export PDF (Fit Canvas)
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- CANVAS WORKSPACE -->
  <main class="flex-1 min-h-0 w-full relative flex items-center justify-center p-2 sm:p-4 bg-[#121212]">
    <div id="canvasWrapper" class="w-full h-full bg-[#121212] shadow-2xl rounded-2xl overflow-hidden relative cursor-none">
      <!-- Background Template Canvas Layer -->
      <canvas id="bgCanvas" class="block absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>
      
      <!-- Interactive Container for Movable/Resizable Image Overlays (Rendered BELOW drawings) -->
      <div id="imageOverlayContainer" class="absolute inset-0 w-full h-full z-10 pointer-events-none"></div>
      
      <!-- Active Drawing Canvas Layer (Rendered ABOVE images) -->
      <canvas id="drawingCanvas" class="block absolute inset-0 w-full h-full z-[15]"></canvas>
      
      <!-- Preview Overlay Canvas for Straight Lines & Guides -->
      <canvas id="previewCanvas" class="block absolute inset-0 w-full h-full pointer-events-none z-[20]"></canvas>
      
      <!-- Tool Cursor Preview Indicator -->
      <div id="toolCursor"></div>
    </div>

    <!-- POPOVER TOOL SETTINGS -->
    <div id="toolPopover" class="hidden absolute bottom-24 left-1/2 -translate-x-1/2 w-[340px] sm:w-[380px] tool-popover rounded-3xl p-4 flex-col gap-4 z-30 transition-all duration-200">
      
      <!-- Color Palette -->
      <div id="colorPalette" class="flex items-center justify-between gap-1">
        <button class="color-preset w-7 h-7 rounded-full bg-red-500 border-2 border-transparent transition active:scale-95" data-color="#ef4444"></button>
        <button class="color-preset w-7 h-7 rounded-full bg-amber-400 border-2 border-transparent transition active:scale-95 ring-2 ring-white" data-color="#fbbf24"></button>
        <button class="color-preset w-7 h-7 rounded-full bg-emerald-500 border-2 border-transparent transition active:scale-95" data-color="#10b981"></button>
        <button class="color-preset w-7 h-7 rounded-full bg-cyan-400 border-2 border-transparent transition active:scale-95" data-color="#22d3ee"></button>
        <button class="color-preset w-7 h-7 rounded-full bg-blue-500 border-2 border-transparent transition active:scale-95" data-color="#3b82f6"></button>
        <button class="color-preset w-7 h-7 rounded-full bg-purple-500 border-2 border-transparent transition active:scale-95" data-color="#a855f7"></button>
        <button class="color-preset w-7 h-7 rounded-full bg-white border-2 border-transparent transition active:scale-95" data-color="#ffffff"></button>
        
        <!-- Custom Color Picker Circle -->
        <label for="colorPicker" class="relative w-7 h-7 rounded-full border border-white/20 bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 cursor-pointer overflow-hidden flex items-center justify-center">
          <input type="color" id="colorPicker" value="#fbbf24" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
          <i data-lucide="pipette" class="w-3.5 h-3.5 text-white drop-shadow"></i>
        </label>
      </div>

      <!-- Size Slider -->
      <div class="flex items-center gap-3 bg-white/5 px-3 py-2 rounded-2xl border border-white/5">
        <span id="sizeVal" class="text-xs font-mono font-bold text-gray-300 w-8 text-center">7px</span>
        <input type="range" id="sizeSlider" min="1" max="50" value="7" class="flex-1 accent-blue-500 cursor-pointer">
      </div>

      <!-- Opacity Slider -->
      <div class="flex items-center gap-3 bg-white/5 px-3 py-2 rounded-2xl border border-white/5">
        <span class="text-xs font-mono font-bold text-gray-300 w-12 text-center">Opacity</span>
        <input type="range" id="opacitySlider" min="0.1" max="1" step="0.05" value="0.4" class="flex-1 accent-blue-500 cursor-pointer">
        <span id="opacityVal" class="text-xs font-mono font-bold text-gray-300 w-8 text-center">40%</span>
      </div>
    </div>
  </main>

  <!-- BOTTOM FLOATING TOOLBAR -->
  <footer class="fixed bottom-4 left-1/2 -translate-x-1/2 z-30">
    <div class="dock-glass px-4 py-2 rounded-full flex items-center gap-2 sm:gap-4 shadow-2xl">
      
      <!-- Keypad/Input Toggle -->
      <button class="p-2 text-gray-400 hover:text-white rounded-full transition">
        <i data-lucide="keyboard" class="w-5 h-5"></i>
      </button>

      <div class="h-5 w-px bg-white/10"></div>

      <!-- Tools Group -->
      <div class="flex items-center gap-1 sm:gap-2">
        <!-- Select / Image Edit Tool -->
        <button data-tool="select" class="tool-btn relative p-2 text-gray-400 hover:text-white rounded-full transition" title="Image Edit / Select Mode">
          <i data-lucide="mouse-pointer-2" class="w-5 h-5"></i>
        </button>

        <!-- Regular Pen (Active Default) -->
        <button data-tool="pen" class="tool-btn relative p-2 text-blue-400 bg-white/10 rounded-full transition" title="Standard Pen">
          <i data-lucide="pen" class="w-5 h-5"></i>
          <span class="absolute bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 bg-blue-400 rounded-full"></span>
        </button>

        <!-- Straight Line Pen -->
        <button data-tool="linePen" class="tool-btn relative p-2 text-gray-400 hover:text-white rounded-full transition" title="Straight Line Pen">
          <i data-lucide="minus" class="w-5 h-5"></i>
        </button>

        <!-- Highlighter -->
        <button data-tool="highlighter" class="tool-btn relative p-2 text-gray-400 hover:text-white rounded-full transition" title="Uniform Highlighter">
          <i data-lucide="highlighter" class="w-5 h-5"></i>
        </button>

        <!-- Eraser -->
        <button data-tool="eraser" class="tool-btn relative p-2 text-gray-400 hover:text-white rounded-full transition" title="Eraser">
          <i data-lucide="eraser" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="h-5 w-px bg-white/10"></div>

      <!-- Actions -->
      <div class="flex items-center gap-1">
        <button id="undoBtn" class="p-2 text-gray-400 hover:text-white disabled:opacity-30 disabled:hover:text-gray-400 rounded-full transition" disabled>
          <i data-lucide="undo-2" class="w-5 h-5"></i>
        </button>
        <button id="redoBtn" class="p-2 text-gray-400 hover:text-white disabled:opacity-30 disabled:hover:text-gray-400 rounded-full transition" disabled>
          <i data-lucide="redo-2" class="w-5 h-5"></i>
        </button>
      </div>

    </div>
  </footer>

  <!-- Modular Application Scripts loaded in dependency order -->
  <script src="js/state.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/engines/flashcardEngine.js"></script>
  <script src="js/engines/templateEngine.js"></script>
  <script src="js/engines/historyManager.js"></script>
  <script src="js/engines/pageManager.js"></script>
  <script src="js/engines/imageManager.js"></script>
  <script src="js/engines/pdfEngine.js"></script>
  <script src="js/controllers/cursorController.js"></script>
  <script src="js/engines/drawingEngine.js"></script>
  <script src="js/engines/canvasEngine.js"></script>
  <script src="js/controllers/uiController.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
